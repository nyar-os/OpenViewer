name: check-rust

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  check-rust:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      # Reads rust-toolchain.toml so CI cannot drift from the pinned channel.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: build native addon
        run: cargo build -p open-viewer-napi --release
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # This job only needs Node for stage-native.ts; do not require pnpm.
          package-manager-cache: false
      - name: stage platform package
        run: node --experimental-strip-types scripts/stage-native.ts
      - name: native addon smoke
        run: node -e "const m = require('./packages/open-viewer-win32-x64/open-viewer.win32-x64.node'); if (!m.capabilities) throw new Error('capabilities export missing'); if (!m.info) throw new Error('info export missing'); console.log(Object.keys(m).join(','))"
