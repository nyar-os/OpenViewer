name: check-typescript

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  check-typescript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Type check
        run: pnpm --filter @wae/open-viewer run typecheck
      - name: Build TS
        run: pnpm run build:ts
      - name: Build UI
        run: pnpm run build:ui
      # `check:skills` runs `open-viewer --help`, which loads the N-API binding at
      # import time. Stage the Windows addon before probing the CLI command tree.
      - name: Build and stage native addon
        run: pnpm run build:napi
      - name: Check agent skills
        run: pnpm run check:skills
